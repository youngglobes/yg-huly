name: Build custom front image (yg)

# Builds ONLY the Huly `front` image from this fork (with the CreateIssue.svelte
# mode:'full' change) and pushes it to GitHub Container Registry.
# Base version pinned to v0.7.426 to match the self-host backend/data model.

on:
  workflow_dispatch: {}
  push:
    branches:
      - yg_develop

permissions:
  contents: read
  packages: write

jobs:
  build-front:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/front
      TAG: v0.7.426-yg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history so `git describe --tags` resolves the version
          fetch-tags: true    # tags are needed by show_version.js / show_tag.js

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          docker image prune -af || true
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Rush install
        run: node common/scripts/install-run-rush.js install

      - name: Build web-client + front-server dependency graphs
        run: node common/scripts/install-run-rush.js build --to @hcengineering/prod --to @hcengineering/pod-front

      - name: Compute versions
        run: |
          echo "MODEL_VERSION=$(node common/scripts/show_version.js)" >> "$GITHUB_ENV"
          echo "VERSION=$(node common/scripts/show_tag.js)" >> "$GITHUB_ENV"
          echo "Model: $(node common/scripts/show_version.js)  Version: $(node common/scripts/show_tag.js)"

      - name: Build web client (dev/prod webpack -> dist)
        working-directory: dev/prod
        run: node ../../common/scripts/install-run-rushx.js package

      - name: Build front server bundle + package dist
        working-directory: pods/front
        run: |
          node ../../common/scripts/install-run-rushx.js bundle
          node ../../common/scripts/install-run-rushx.js package

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        working-directory: pods/front
        run: |
          docker build -t "${IMAGE}:${TAG}" .
          docker push "${IMAGE}:${TAG}"
          echo "Pushed ${IMAGE}:${TAG}"

  deploy-front:
    # Auto-pull the freshly pushed image on the server (same tag, new content).
    # Requires repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
    needs: build-front
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking accept-new\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" >> ~/.ssh/config

      - name: Pull new front image and restart
        run: |
          ssh server 'cd /home/developer/huly-selfhost \
            && docker compose pull front \
            && docker compose up -d front \
            && docker compose restart nginx'

      - name: Health check
        run: |
          ssh server '
            set -e
            for i in $(seq 1 12); do
              code=$(curl -sk -o /dev/null -w "%{http_code}" -m 10 https://localhost/ || true)
              echo "attempt $i: front=$code"
              [ "$code" = "200" ] && { echo "HEALTHY"; exit 0; }
              sleep 5
            done
            echo "UNHEALTHY after front deploy"; exit 1'
