HULY_VERSION=v0.6.501
DOCKER_NAME=huly

# The address of the host or server from which you will access your Huly instance.
# This can be a domain name (e.g., huly.example.com) or an IP address (e.g., 192.168.1.1).
HOST_ADDRESS=localhost:8080

# Set this variable to 'true' to enable SSL (HTTPS/WSS). 
# Leave it empty to use non-SSL (HTTP/WS).
SECURE=

# Specify the IP address to bind to; leave blank to bind to all interfaces (0.0.0.0).
# Do not use IP:PORT format in HTTP_BIND or HTTP_PORT.
HTTP_PORT=8080
HTTP_BIND=

# Huly specific variables
TITLE=Huly Self Host
DEFAULT_LANGUAGE=en
LAST_NAME_FIRST=true

# Redpanda variables
REDPANDA_ADMIN_USER=superadmin
REDPANDA_ADMIN_PWD=panda_secret

# CockroachDB variables
CR_DATABASE=defaultdb
CR_USERNAME=selfhost
CR_USER_PASSWORD=cr_secret

# Blob storage backend (STORAGE_CONFIG).
# compose.yml and run-tool.sh both read ${STORAGE_CONFIG} from here, so the S3
# secret lives ONLY in this (gitignored) file — never in the tracked compose.yml.
# ';'-separated list; the LAST entry is the default (new blobs are written there),
# all entries are readable (fallback). Quote the value (the ';' and '&' need it).
#
#   Local MinIO only (default self-host):
# STORAGE_CONFIG="minio|minio?accessKey=minioadmin&secretKey=minioadmin"
#
#   AWS S3 as the live store (this deployment): put files on S3, no local disk growth.
#   region must be near the server; rootBucket = one shared bucket for all workspaces.
# STORAGE_CONFIG="s3|https://s3.eu-central-1.amazonaws.com?accessKey=<S3_ACCESS_KEY>&secretKey=<S3_SECRET_KEY>&region=eu-central-1&rootBucket=ygs-huly-files"
#
#   Migration/fallback (MinIO readable, new writes -> S3): keep both, S3 last (=default).
# STORAGE_CONFIG="minio|minio?accessKey=minioadmin&secretKey=minioadmin;s3|https://s3.eu-central-1.amazonaws.com?accessKey=<KEY>&secretKey=<SECRET>&region=eu-central-1&rootBucket=ygs-huly-files"
#
# NOTE: URL-encode any + / = in the secret key (%2B %2F %3D).

# Docker volume paths - specify custom paths for persistent data storage
# Leave empty to use default Docker named volumes
VOLUME_ELASTIC_PATH=
VOLUME_FILES_PATH=
VOLUME_CR_DATA_PATH=
VOLUME_CR_CERTS_PATH=
VOLUME_REDPANDA_PATH=

# The following configs are auto-generated by the setup script. 
# Please do not manually overwrite.

# Run with --secret to regenerate.
SECRET=example_secret_key_here
